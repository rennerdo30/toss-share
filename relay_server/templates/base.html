<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Toss Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .stat-card {
            @apply bg-white rounded-lg shadow p-6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold">Toss Relay Admin</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="hover:text-indigo-200 {% block nav_dashboard %}{% endblock %}">Dashboard</a>
                    <a href="/admin/devices" class="hover:text-indigo-200 {% block nav_devices %}{% endblock %}">Devices</a>
                    <form action="/admin/logout" method="POST" class="inline">
                        <button type="submit" class="hover:text-indigo-200">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto py-4 text-center text-gray-500 text-sm">
        <p>Toss Relay Server &middot; Admin Dashboard</p>
    </footer>
</body>
</html>
