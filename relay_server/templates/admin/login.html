<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - Toss Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            input:focus-visible,
            button:focus-visible {
                @apply outline-none ring-2 ring-indigo-500 ring-offset-2 ring-offset-white;
            }
        }

        @layer components {
            /* Same component vocabulary as base.html so both stay in sync. */
            .card {
                @apply rounded-xl bg-white shadow-lg ring-1 ring-slate-900/5;
            }
            .label {
                @apply mb-1.5 block text-sm font-medium text-slate-700;
            }
            .input {
                @apply block w-full rounded-lg border-0 bg-white px-3 py-2 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 transition placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600;
            }
            .btn {
                @apply inline-flex w-full items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-semibold transition-colors;
            }
            .btn-primary {
                @apply bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800;
            }
            .alert-error {
                @apply rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-800 ring-1 ring-inset ring-rose-200;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="flex min-h-full items-center justify-center bg-slate-50 p-4 text-slate-800 antialiased">
    <main class="w-full max-w-sm">
        <div class="mb-6 flex flex-col items-center gap-3 text-center">
            <span class="grid h-12 w-12 place-items-center rounded-xl bg-indigo-600 text-white shadow-md">
                <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
            </span>
            <div>
                <h1 class="text-xl font-semibold tracking-tight text-slate-900">Toss Relay Admin</h1>
                <p class="mt-1 text-sm text-slate-500">Sign in to manage this relay server.</p>
            </div>
        </div>

        <div class="card p-6 sm:p-8">
            {% if has_error %}
            <div class="alert-error mb-5" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form action="/admin/login" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="label">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autofocus
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        class="input"
                    >
                </div>

                <div>
                    <label for="password" class="label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        class="input"
                    >
                </div>

                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>
    </main>
</body>
</html>
