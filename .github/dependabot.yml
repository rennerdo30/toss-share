# Dependabot configuration.
#
# Every version update across all ecosystems lands in ONE pull request per
# week (a multi-ecosystem group), so the review queue never holds more than
# one dependency PR. A short cooldown skips releases that are only hours old.
# Security updates are not delayed and arrive as soon as an advisory matches.
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "npm"
    directories:
      - "/browser_extension"
      - "/docs"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "cargo"
    # /rust_core and /flutter_app/rust are members of the root workspace and
    # are covered by "/"; listing them separately makes Cargo see two
    # workspace roots and every update fails. /relay_server is standalone.
    directories:
      - "/"
      - "/relay_server"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "pub"
    directory: "/flutter_app"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker"
    directory: "/relay_server"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker-compose"
    directory: "/relay_server"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 3
