name: Bridge Version Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge-version:
    name: Verify Bridge Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check-frb-version.py
