<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toss - Clipboard Sync</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img src="../icons/icon32.png" alt="Toss" class="logo">
        <h1 class="title">Toss</h1>
      </div>
      <div class="header-right">
        <span id="connectionStatus" class="status-badge disconnected">
          <span class="status-dot"></span>
          <span class="status-text">Disconnected</span>
        </span>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Quick Actions -->
    <section class="quick-actions">
      <button id="sendClipboardBtn" class="action-btn primary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Send Clipboard
      </button>
      <button id="connectBtn" class="action-btn secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        Connect
      </button>
    </section>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="history">History</button>
      <button class="tab" data-tab="devices">Devices</button>
    </nav>

    <!-- Tab Content -->
    <main class="tab-content">
      <!-- History Tab -->
      <div id="historyTab" class="tab-panel active">
        <div id="historyList" class="history-list">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <p>No clipboard history yet</p>
            <p class="hint">Copy something to get started</p>
          </div>
        </div>
        <button id="clearHistoryBtn" class="clear-btn" hidden>Clear History</button>
      </div>

      <!-- Devices Tab -->
      <div id="devicesTab" class="tab-panel">
        <div id="devicesList" class="devices-list">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <p>No paired devices</p>
            <p class="hint">Add a device to start syncing</p>
          </div>
        </div>
        <button id="addDeviceBtn" class="add-device-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add Device
        </button>
      </div>
    </main>

    <!-- Pairing Modal -->
    <div id="pairingModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Pair Device</h2>
          <button class="close-btn" id="closePairingModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="pairing-tabs">
            <button class="pairing-tab active" data-pairing-tab="scan">Scan Code</button>
            <button class="pairing-tab" data-pairing-tab="show">Show My Code</button>
          </div>
          <div id="scanCodePanel" class="pairing-panel active">
            <p>Enter the 6-digit code from the Toss app:</p>
            <div class="code-input-container">
              <input type="text" id="pairingCodeInput" class="code-input" maxlength="6" placeholder="000000" autocomplete="off">
            </div>
            <div id="deviceNameInput" class="device-name-input" hidden>
              <label for="deviceName">Device Name:</label>
              <input type="text" id="deviceName" placeholder="My Phone">
            </div>
            <button id="pairBtn" class="action-btn primary" disabled>Pair</button>
          </div>
          <div id="showCodePanel" class="pairing-panel">
            <p>Enter this code in the Toss app:</p>
            <div id="myPairingCode" class="pairing-code">------</div>
            <p class="hint">Code expires in <span id="codeExpiry">5:00</span></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../js/popup.js"></script>
</body>
</html>
