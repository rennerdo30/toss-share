<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
  <!-- Clipboard icon -->
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clipboard body -->
    <rect x="36" y="32" width="56" height="72" rx="4"/>
    <!-- Clipboard clip -->
    <rect x="48" y="24" width="32" height="16" rx="4"/>
    <!-- Arrow pointing right (send) -->
    <path d="M52 68 L76 68"/>
    <path d="M68 60 L76 68 L68 76"/>
  </g>
